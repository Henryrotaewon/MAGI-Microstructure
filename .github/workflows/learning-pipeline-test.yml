name: MAGI Learning Pipeline Test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/learning/**"
      - "tests/test_learning_pipeline.py"
      - ".github/workflows/learning-pipeline-test.yml"

jobs:
  learning-pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run learning pipeline tests
        run: python -m unittest tests/test_learning_pipeline.py -v
